# Single-VPS deployment: `docker compose up -d`
# Scaling knob for contest day: `docker compose up -d --scale worker=4 --scale judge0-workers=4`
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      PORT: 3000

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "npx prisma db push --skip-generate && node dist/index.js"
    environment: &api-env
      DATABASE_URL: postgresql://platform:${DB_PASSWORD:-platform}@db:5432/platform
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://judge0-server:2358
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WEB_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on: [db, redis]

  worker:
    build: ./api
    restart: unless-stopped
    command: node dist/judge/worker-main.js
    environment:
      <<: *api-env
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
    depends_on: [db, redis, judge0-server]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform}
      POSTGRES_DB: platform
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # ---- Judge0 CE (own db/redis per upstream defaults; isolated failure domain) ----
  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    volumes:
      - ./deploy/judge0.conf:/judge0.conf:ro
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true # required by isolate sandbox
    volumes:
      - ./deploy/judge0.conf:/judge0.conf:ro
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0pw}
      POSTGRES_DB: judge0
    volumes:
      - judge0-pg-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:6
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]

volumes:
  pg-data:
  redis-data:
  judge0-pg-data:
  caddy-data:
