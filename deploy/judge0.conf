# Judge0 CE configuration (subset; see https://github.com/judge0/judge0/blob/master/judge0.conf)
REDIS_HOST=judge0-redis
REDIS_PORT=6379

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pw

# Sandbox hardening (spec 5.6/6): no network inside runs, bounded output
ENABLE_NETWORK=false
MAX_QUEUE_SIZE=500
MAX_CPU_TIME_LIMIT=20
MAX_WALL_TIME_LIMIT=30
MAX_MEMORY_LIMIT=1048576
MAX_STDOUT_SIZE=10485760

# Don't phone home
JUDGE0_TELEMETRY_ENABLE=false
